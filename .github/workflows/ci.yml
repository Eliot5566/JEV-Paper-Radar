name: CI

on:
  push:
    paths-ignore: ["data/**", "site/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: paper-radar check
      - run: paper-radar check -c profiles/claude-starter.toml --show-questions
      - run: paper-radar demo --out /tmp/demo
      - name: Build Claude upload package
        run: python scripts/build_claude_skill.py --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: paper-radar-claude-python-${{ matrix.python }}
          path: dist/paper-radar-claude.zip
