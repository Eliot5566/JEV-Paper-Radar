name: Publish to PyPI

# Tag a release (git tag v0.1.0 && git push origin v0.1.0) and this publishes
# the sdist + wheel to PyPI. No token is stored anywhere: PyPI Trusted
# Publishing (OIDC) mints a short-lived token at runtime, so the project
# needs a pending trusted publisher on PyPI first, pointing at this repo,
# this workflow file, and (if set) the "pypi" environment below.
# Nothing is published on a plain push to main.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
