name: Publish saved feeds and showcase

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "scripts/build_public_site.py"
      - ".github/workflows/showcase.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the daily workflow's group so deployments cannot race one another.
concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Eliot5566/JEV-Paper-Radar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Rebuild committed decisions and copy the showcase
        run: python scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
