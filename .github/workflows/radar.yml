name: Paper Radar

on:
  schedule:
    # 02:00 UTC Mon–Fri (10:00 in Taipei): after arXiv's 20:00 US-Eastern announcement, all year round.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Judge at most N papers (leave blank for no limit)"
        required: false
        default: ""

permissions:
  contents: write   # commit the audit trail in data/
  pages: write      # publish the site
  id-token: write
  issues: write     # close the 👍/👎 issues after folding them into data/labels.jsonl

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Paper Radar
        run: pip install .

      - name: Collect 👍/👎 feedback left as issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: paper-radar harvest

      - name: Read today's papers
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            paper-radar run --limit "$LIMIT"
          else
            paper-radar run
          fi

      - name: Public radars
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional: 10 req/s instead of 3
        continue-on-error: true   # a public page must never block your own radar
        run: |
          # One radar per config. A failure in one is logged and the rest still run,
          # so a bad PubMed query cannot take the whole directory down with it.
          for config in radar.public.toml radars/*.toml; do
            [ -f "$config" ] || continue
            echo "::group::$config"
            paper-radar run -c "$config" --base-dir . --no-notify || echo "!! $config failed"
            echo "::endgroup::"
          done

      - name: Build the feed directory
        continue-on-error: true
        run: |
          configs=$(ls radar.public.toml radars/*.toml 2>/dev/null) || true
          if [ -n "$configs" ]; then
            paper-radar directory --out site/public/index.html --base . --base-dir . $configs
          fi

      - name: Commit audit trail
        run: |
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No new decisions to commit"
          else
            git commit -m "radar: $(date -u +%F)"
            git push || (git pull --rebase && git push)
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
