name: Setup help / 使用設定協助
description: Report a first-run problem or documentation gap without sharing credentials.
title: "[Setup]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Start with [Claude quickstart](https://github.com/Eliot5566/JEV-Paper-Radar/blob/main/docs/claude-quickstart.md).
        This is a public issue. Do not include keys, full environment variables, private paper text or unpublished research.
  - type: input
    id: version
    attributes:
      label: Version or release used
      description: For the Claude upload, paste the release tag. For the CLI, use paper-radar --version. Say unknown if you are unsure.
      placeholder: "claude-skill-v0.1.0, paper-radar 0.2.0, or unknown"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and backend
      description: Claude web/desktop/Code, or local/Actions with OS and Python version. Add the model if known. Never include credentials.
      placeholder: "Claude web, Opus; or Windows, Python 3.12, local CLI"
    validations:
      required: true
  - type: dropdown
    id: first_step
    attributes:
      label: Which step needs help?
      options:
        - "Viewing the examples"
        - "Downloading or uploading the skill ZIP"
        - "Enabling or finding the skill"
        - "Running the offline demo"
        - "Ranking my abstracts"
        - "Opening or downloading a report"
        - "Live feeds or automation"
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Command or workflow step, expected result, actual result, and a short redacted error. Share configuration only if it can be public.
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Does the offline demo work?
      options:
        - "Not tried"
        - "Yes"
        - "No"
    validations:
      required: true
