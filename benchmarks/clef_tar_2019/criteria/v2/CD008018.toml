# CLEF TAR 2019 topic CD008018 — Adjuvant GnRH analogues to prevent chemotherapy-induced premature ovarian failure
#
# Criteria derived from the review's own published selection criteria, quoted below
# verbatim from its PubMed abstract (PMID 30827035). The quote is kept here so that the
# translation into criteria can be checked, and disputed, by anyone rerunning this.
#
# SELECTION CRITERIA, as published:
#   Randomised controlled trials (RCTs), in all languages, which examined the effect of GnRH
#   analogues for chemotherapy-induced ovarian failure in premenopausal women, were eligible
#   for inclusion in the review.
#
# ── v2 revision ──────────────────────────────────────────────────────────────
# Revised after the v1 run, for two reasons that do not depend on how v1 scored:
#
# R1  One idea per criterion. This project's own README tells users to split a
#     criterion that bundles several conditions; several v1 criteria broke that rule.
# R2  Design criteria are phrased at the breadth the review actually screened at.
#     Abstract-stage screening errs toward inclusion on design, because abstracts
#     often do not state it: 53% of CD011571's abstract-stage inclusions are not
#     tagged "Randomized Controlled Trial" by NLM.
#
# criteria/v1/ holds the literal translation, unchanged. Both are reported.

[benchmark]
topic = "CD008018"
review_pmid = "30827035"
review_title = "Adjuvant GnRH analogues to prevent chemotherapy-induced premature ovarian failure"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a controlled trial in which participants were assigned to treatment groups"

[[screening.include]]
id = "population"
text = "The participants are premenopausal women receiving chemotherapy"

[[screening.include]]
id = "intervention"
text = "The study evaluates a gonadotropin-releasing hormone analogue"

[[screening.include]]
id = "outcome"
text = "The study reports ovarian function, menstruation, or fertility after treatment"
