# CLEF TAR 2019 topic CD011436 — Ultrasound guidance for perioperative neuraxial and peripheral nerve blocks in children
#
# Criteria derived from the review's own published selection criteria, quoted below
# verbatim from its PubMed abstract (PMID 30820938). The quote is kept here so that the
# translation into criteria can be checked, and disputed, by anyone rerunning this.
#
# SELECTION CRITERIA, as published:
#   We included all parallel randomized controlled trials that evaluated the effects of
#   ultrasound guidance used when a regional blockade technique was performed in children.
#   We included studies performed in children (<= 18 years of age) undergoing any type of
#   surgical procedure (open or laparoscopic), for which a neuraxial or peripheral nerve
#   block, for surgical anaesthesia or for postoperative analgesia, was performed with
#   ultrasound guidance.
#
# ── v2 revision ──────────────────────────────────────────────────────────────
# Revised after the v1 run, for two reasons that do not depend on how v1 scored:
#
# R1  One idea per criterion. This project's own README tells users to split a
#     criterion that bundles several conditions; several v1 criteria broke that rule.
# R2  Design criteria are phrased at the breadth the review actually screened at.
#     Abstract-stage screening errs toward inclusion on design, because abstracts
#     often do not state it: 53% of CD011571's abstract-stage inclusions are not
#     tagged "Randomized Controlled Trial" by NLM.
#
# criteria/v1/ holds the literal translation, unchanged. Both are reported.

[benchmark]
topic = "CD011436"
review_pmid = "30820938"
review_title = "Ultrasound guidance for perioperative neuraxial and peripheral nerve blocks in children"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a controlled trial in which participants were assigned to treatment groups"

[[screening.include]]
id = "population"
text = "The participants are children undergoing a surgical procedure"

[[screening.include]]
id = "intervention"
text = "The study evaluates the use of ultrasound guidance during a procedure"

[[screening.include]]
id = "procedure"
text = "The procedure is a neuraxial block or a peripheral nerve block"
