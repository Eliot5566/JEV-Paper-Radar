# CLEF TAR 2019 topic CD006715 — Epidural analgesia for adults undergoing cardiac surgery
#
# Criteria derived from the review's own published selection criteria, quoted below
# verbatim from its PubMed abstract (PMID 30821845). The quote is kept here so that the
# translation into criteria can be checked, and disputed, by anyone rerunning this.
#
# SELECTION CRITERIA, as published:
#   We included all randomized controlled trials (RCTs) including adults undergoing any type
#   of cardiac surgery under general anaesthesia and comparing epidural analgesia versus
#   another modality of postoperative pain treatment.
#
# ── v2 revision ──────────────────────────────────────────────────────────────
# Revised after the v1 run, for two reasons that do not depend on how v1 scored:
#
# R1  One idea per criterion. This project's own README tells users to split a
#     criterion that bundles several conditions; several v1 criteria broke that rule.
# R2  Design criteria are phrased at the breadth the review actually screened at.
#     Abstract-stage screening errs toward inclusion on design, because abstracts
#     often do not state it: 53% of CD011571's abstract-stage inclusions are not
#     tagged "Randomized Controlled Trial" by NLM.
#
# criteria/v1/ holds the literal translation, unchanged. Both are reported.

[benchmark]
topic = "CD006715"
review_pmid = "30821845"
review_title = "Epidural analgesia for adults undergoing cardiac surgery"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a controlled trial in which participants were assigned to treatment groups"

[[screening.include]]
id = "population"
text = "The participants are adults undergoing cardiac surgery"

[[screening.include]]
id = "intervention"
text = "The study evaluates epidural analgesia"

[[screening.include]]
id = "comparator"
text = "The study includes a comparison group given a different form of pain treatment"
