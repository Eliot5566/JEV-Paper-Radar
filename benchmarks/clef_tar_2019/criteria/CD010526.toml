# CLEF TAR 2019 topic CD010526 — Dental cavity liners for Class I and Class II resin-based composite restorations
#
# Criteria derived from the review's own published selection criteria, quoted below
# verbatim from its PubMed abstract (PMID 30834516). The quote is kept here so that the
# translation into criteria can be checked, and disputed, by anyone rerunning this.
#
# SELECTION CRITERIA, as published:
#   We included randomized controlled trials assessing the effects of the use of liners
#   under Class I and Class II posterior resin-based composite restorations in permanent
#   teeth (in both adults and children). We included both parallel and split-mouth designs.

[benchmark]
topic = "CD010526"
review_pmid = "30834516"
review_title = "Dental cavity liners for Class I and Class II resin-based composite restorations"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a randomised controlled trial, of either parallel or split-mouth design"

[[screening.include]]
id = "population"
text = "The restorations are placed in permanent posterior teeth"

[[screening.include]]
id = "intervention"
text = "The study evaluates the use of a dental cavity liner under a Class I or Class II resin-based composite restoration"
