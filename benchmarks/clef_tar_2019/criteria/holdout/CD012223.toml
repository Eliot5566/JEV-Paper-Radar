# CLEF TAR 2019 topic CD012223 — Cyclodestructive procedures for refractory glaucoma
#
# HELD-OUT TOPIC. Not used while diagnosing or revising anything. These criteria were
# written once, from the review's own published selection criteria (PMID 30852841,
# quoted verbatim below), using the same two rules as criteria/v2, and were not touched
# after any result was seen.
#
# SELECTION CRITERIA, as published:
#   We included randomized controlled trials or quasi-randomized trials in which
#   participants underwent a secondary procedure for refractory glaucoma. We included trials
#   with any laser type, route of administration, and laser settings.

[benchmark]
topic = "CD012223"
review_pmid = "30852841"
review_title = "Cyclodestructive procedures for refractory glaucoma"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a controlled trial in which participants were assigned to treatment groups"

[[screening.include]]
id = "population"
text = "The participants have glaucoma that remains uncontrolled after previous treatment"

[[screening.include]]
id = "intervention"
text = "The study evaluates a cyclodestructive procedure of the ciliary body"
