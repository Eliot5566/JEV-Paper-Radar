# CLEF TAR 2019 topic CD012930 — Once-daily LABA/LAMA combination inhaler versus placebo for COPD
#
# Criteria derived from the review's own published selection criteria, quoted below
# verbatim from its PubMed abstract (PMID 30839102). The quote is kept here so that the
# translation into criteria can be checked, and disputed, by anyone rerunning this.
#
# SELECTION CRITERIA, as published:
#   We included parallel-group and cross-over randomised controlled trials (RCTs) comparing
#   once-daily LABA/LAMA FDC versus placebo. We excluded very short-term trials with a
#   duration of less than 3 weeks. We included adults (>= 40 years old) with a diagnosis of
#   stable COPD.
#
# NOT ENCODED:
#   The review also excluded trials shorter than three weeks. That is a numeric comparison,
#   which this tool never delegates to the model, so it is not encoded. Expect lower
#   precision on this topic as a result.

[benchmark]
topic = "CD012930"
review_pmid = "30839102"
review_title = "Once-daily LABA/LAMA combination inhaler versus placebo for COPD"

[screening]
enabled = true
target_recall = 0.95

[[screening.include]]
id = "design"
text = "The study is a parallel-group or cross-over randomised controlled trial"

[[screening.include]]
id = "population"
text = "The participants are adults with stable chronic obstructive pulmonary disease"

[[screening.include]]
id = "intervention"
text = "The study compares a once-daily fixed-dose combination of a long-acting beta2-agonist and a long-acting muscarinic antagonist in a single inhaler against placebo"
