# A second radar that runs alongside your personal one and publishes a PUBLIC page,
# so visitors can see a live result without an API key of their own.
#   paper-radar run -c radar.public.toml
# It writes to site/public/ and data/public/, and never touches your personal radar.

[radar]
title = "Paper Radar · today in AI"
max_papers = 1500

[jev]
backend = "typesafe"
model = "jev-1.13.0"
concurrency = 8

[[sources]]
type = "arxiv"
categories = ["cs.AI", "cs.CL", "cs.LG"]
include_cross_lists = false   # primary submissions only, to keep the demo cheap

# Interests for a public digest.
#
# Two measured lessons, both from real runs rather than guesses:
#
# 1. Crisply worded, single-concept statements produce confident hits. Vague ones
#    ("clearly outperforms previous approaches") never crossed 0.95 at all.
# 2. A criterion that is technically true of most papers will fire on most papers.
#    "introduces a benchmark or an evaluation method" matched 30 of 247 submissions
#    on 2026-09-24 — 12% — because nearly every ML paper evaluates something. Raising
#    the threshold to 0.98 still left 16 while wiping out the other four interests, so
#    the fix is the wording, not the threshold. Ask for the CONTRIBUTION, not the
#    presence of the thing.
[[interests]]
id = "new_model"
label = "New model"
text = "The paper introduces a new language model or a new training method for one"

[[interests]]
id = "agents"
label = "Agents"
text = "The paper is about LLM agents that use tools or browse the web"

[[interests]]
id = "evaluation"
label = "Evaluation"
text = "The paper's main contribution is a new benchmark or dataset for evaluating language models"

[[interests]]
id = "efficiency"
label = "Efficiency"
text = "The paper makes language model inference faster or cheaper"

[[interests]]
id = "hallucination"
label = "Hallucination"
text = "The paper measures or reduces hallucination in language model outputs"

[thresholds]
must_read = 0.95      # tuned on real scores: 0.88 kept 73/299, 0.95 kept 41/247, and the
                      # remaining looseness was one interest's wording, fixed above
maybe = 0.90
exclude = 0.80

[signals]
paper_type = true
code_release = true

[output]
site_dir = "site/public"
data_dir = "data/public"
site_url = "https://eliot5566.github.io/JEV-Paper-Radar/public/"
feed_days = 14
near_misses = 0
feedback_repo = ""    # no voting on the public page; votes belong to your own radar
tagline = "Today's standouts across cs.AI, cs.CL and cs.LG, picked by Jev from every new submission."
