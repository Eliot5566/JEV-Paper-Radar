# The general-AI public radar. One of several under radars/ — this one keeps its own
# file and its data_dir at data/public/ rather than data/public/ai/, so the history from
# before the other radars existed stays where it is.
#   paper-radar run -c radar.public.toml
# `paper-radar directory` builds the index at site/public/index.html that lists them all.

[radar]
title = "Paper Radar · today in AI"
max_papers = 1500

[jev]
backend = "typesafe"
model = "jev-1.13.0"
concurrency = 8

[[sources]]
type = "arxiv"
categories = ["cs.AI", "cs.CL", "cs.LG"]
include_cross_lists = false   # primary submissions only, to keep the demo cheap

# Interests for a public digest. Measured lesson from the first run (299 papers):
# crisply worded, single-concept statements produced confident hits; vague ones
# ("clearly outperforms previous approaches") never crossed 0.95 at all.
[[interests]]
id = "new_model"
label = "New model"
text = "The paper introduces a new language model or a new training method for one"

[[interests]]
id = "agents"
label = "Agents"
text = "The paper is about LLM agents that use tools or browse the web"

[[interests]]
id = "evaluation"
label = "Evaluation"
text = "The paper introduces a benchmark or an evaluation method for language models"

[[interests]]
id = "efficiency"
label = "Efficiency"
text = "The paper makes language model inference faster or cheaper"

[[interests]]
id = "hallucination"
label = "Hallucination"
text = "The paper measures or reduces hallucination in language model outputs"

[thresholds]
must_read = 0.95      # tuned on real scores: 0.88 kept 73 of 299 papers, 0.95 keeps ~28
maybe = 0.90
exclude = 0.80

[signals]
paper_type = true
code_release = true

[output]
site_dir = "site/public/ai"
data_dir = "data/public"
site_url = "https://eliot5566.github.io/JEV-Paper-Radar/public/ai/"
feed_days = 14
near_misses = 0
feedback_repo = ""    # no voting on the public page; votes belong to your own radar
tagline = "Today's standouts across cs.AI, cs.CL and cs.LG, picked by Jev from every new submission."
