[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-radar"
version = "0.1.0"
description = "Let Jev read every new paper on arXiv and bioRxiv each day, then show you the few worth reading. Plain-English interests, calibrated probabilities, cents per day."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["arxiv", "biorxiv", "papers", "research", "literature", "recommendation", "rss", "jev", "typesafe", "system-one"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/paper-radar"

[tool.setuptools.packages.find]
include = ["paper_radar*"]

[tool.setuptools.package-data]
paper_radar = ["demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
