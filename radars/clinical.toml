# Clinical AI Radar
# One of several public radars. Each publishes its own page and RSS feed so a visitor
# can subscribe without forking anything; `paper-radar directory` builds the index.
#
# Interests are deliberately few and phrased for the CONTRIBUTION, not the presence of
# a topic. Measured on 2026-09-24: "introduces a benchmark or an evaluation method"
# fired on 12% of cs.* submissions because nearly every paper evaluates something.
# Rewording to "the paper's main contribution is..." took one radar from 41 picks to 14
# with no threshold change.

[radar]
title = "Clinical AI Radar"
max_papers = 1500

[jev]
backend = "typesafe"
model = "jev-1.13.0"
concurrency = 8

[[sources]]
type = "pubmed"
query = '("machine learning"[Title/Abstract] OR "deep learning"[Title/Abstract] OR "artificial intelligence"[Title/Abstract]) AND ("patients"[Title/Abstract] OR "clinical"[Title/Abstract])'
days = 2
email = "a7868783@gmail.com"
max_records = 1200

# The PubMed query already selects for machine learning AND patients, so asking
# "does this evaluate a model on patients?" matched 168 of 447 records — 38%. A
# criterion that restates the search strategy selects nothing. These ask for the two
# things that are actually rare in clinical ML, and that clinicians treat as the
# quality markers: was it tested forward in time, and was it tested somewhere else.

[[interests]]
id = "prospective"
label = "Prospective"
text = "The model was tested prospectively on patients seen after the model was built"

[[interests]]
id = "external"
label = "External validation"
text = "The model was validated on patients from a different hospital or population than it was developed on"

[[interests]]
id = "llm_clinical"
label = "Language models"
text = "The paper's main contribution is a large language model applied to clinical decisions or clinical notes"

[thresholds]
must_read = 0.95
maybe = 0.90
exclude = 0.80

[signals]
paper_type = true
code_release = false

[output]
site_dir = "site/public/clinical"
data_dir = "data/public/clinical"
site_url = "https://eliot5566.github.io/JEV-Paper-Radar/public/clinical/"
feed_days = 14
near_misses = 0
tagline = "Machine learning evaluated on patients, from new PubMed records — not preprints."
