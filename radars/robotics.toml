# Robot Learning Radar
# One of several public radars. Each publishes its own page and RSS feed so a visitor
# can subscribe without forking anything; `paper-radar directory` builds the index.
#
# Interests are deliberately few and phrased for the CONTRIBUTION, not the presence of
# a topic. Measured on 2026-09-24: "introduces a benchmark or an evaluation method"
# fired on 12% of cs.* submissions because nearly every paper evaluates something.
# Rewording to "the paper's main contribution is..." took one radar from 41 picks to 14
# with no threshold change.

[radar]
title = "Robot Learning Radar"
max_papers = 800

[jev]
backend = "typesafe"
model = "jev-1.13.0"
concurrency = 8

[[sources]]
type = "arxiv"
categories = ["cs.RO"]
include_cross_lists = false

[[interests]]
id = "manipulation"
label = "Manipulation"
text = "The paper's main contribution is a learned method for robotic manipulation or grasping"

[[interests]]
id = "vla"
label = "Vision-language-action"
text = "The paper's main contribution is a policy that maps language and vision to robot actions"

[[interests]]
id = "sim2real"
label = "Sim-to-real"
text = "The paper's main contribution is a method for transferring a learned policy from simulation to hardware"

[thresholds]
must_read = 0.95
maybe = 0.90
exclude = 0.80

[signals]
paper_type = true
code_release = true

[output]
site_dir = "site/public/robotics"
data_dir = "data/public/robotics"
site_url = "https://eliot5566.github.io/JEV-Paper-Radar/public/robotics/"
feed_days = 14
near_misses = 0
tagline = "Learned control and manipulation, from every new cs.RO submission."
