# ── What is worth reading ───────────────────────────────────────────────────────
# One idea per interest, phrased as what the item IS. None of them mentions a topic:
# the sources already decide the topic, and asking "is this about AI?" on a feed of AI
# news fires on everything, which is the same as filtering nothing.

[[interests]]
id = "first_party"
label = "First-party"
text = "The item is an announcement published by the organisation that made the thing it describes: a release, a price change, a shutdown, or a result they measured themselves"

[[interests]]
id = "measurement"
label = "Measured result"
# First version was "reports a specific measured quantity ... such as a funding amount".
# Measured on the 2026-10-02 run it fired at 92-99% on a bird-noise story, a measles
# death toll and someone's newsletter subscriber milestone, and it was the top chip on
# nearly every must-read. Any prose containing a numeral satisfied it. The number now
# has to be a property OF something named, which is what made it interesting in the
# first place.
text = "The item reports a measured result for a specific named product, model, or system: a benchmark score, a throughput or latency figure, a price, or an error rate"

[[interests]]
id = "usable"
label = "Usable today"
text = "The item is something a reader can use immediately: source code, model weights, an API, a dataset, or a product that is generally available"

# ── What gets vetoed ────────────────────────────────────────────────────────────
# Each one is phrased as what the item IS, never as "not X": Jev reads a negation
# literally, and `paper-radar check` will warn about one.

# Two exclusions have been removed from this file, both for the same reason, and the
# reason is the most useful thing measured here:
#
#   "a news story about an article, post, or announcement published somewhere else"
#       → fired 105 of 200 exclusions (2026-10-02). Deleted "Cloudflare Python Workers
#         are now generally available", "Claude Sonnet 5.5", "SvelteKit 3", a $30M
#         Series A.
#   "consists entirely of a quotation, or a one-line pointer to something published
#   elsewhere"
#       → written as the narrow replacement for the above, and fired 104 of 169 the very
#         next run. Deleted "SvelteKit 3" and the Series A again.
#
# Both were literally correct every time. A link blog or a Techmeme item IS a short
# pointer to something published elsewhere — that is the form of the entire channel, and
# that channel is how most first-party news arrives. An exclusion that describes an
# item's FORM therefore vetoes whole sources, while the ones that survive here describe
# its SUBJECT ("off topic") or its EPISTEMIC STATUS ("speculation", "asking the room",
# "argument", "reaction"): 28, 53, 4, 11 and 13 fires in the same run, none of them
# eating the signal.
#
# Mechanical properties belong in code, not in a criterion: "I have already seen this
# story" is duplicate folding, which keeps one copy instead of dropping all of them.
# And remember the asymmetry — interests combine with `max`, so a loose interest can
# only add noise, while a loose exclusion silently deletes what you were looking for.
[[exclude]]
id = "offtopic"
label = "Off topic"
# The press accounts on Bluesky publish everything they publish. On 2026-10-02 that put
# a measles death toll and "Two New Birds Louder Than Jackhammers" into the must-read
# list, both at 92-95%. The radar has no topic filter by design — the sources were meant
# to be the topic filter — and general-interest outlets break that assumption.
text = "The item is primarily about health, medicine, politics, sport, wildlife, crime, or entertainment rather than computing and the technology industry"

[[exclude]]
id = "speculation"
label = "Speculation"
text = "The item is a prediction, forecast, or opinion about what will happen in the future"

[[exclude]]
id = "asking"
label = "Asking the room"
text = "The item asks a community for opinions, advice, recommendations, or help with a problem"

[[exclude]]
id = "argument"
label = "Argument"
text = "The item is an argument about politics, ideology, or the personalities of individual people"

[[exclude]]
id = "reaction"
label = "Reaction"
text = "The item is a screenshot, a meme, or a one-line reaction to something someone else said"

[thresholds]
# Starting points, not measured ones. After a week of running, `paper-radar calibrate`
# fits these to your own 👍/👎 and prints what it would change.
must_read = 0.90
maybe = 0.80
exclude = 0.70              # an exclusion vetoes at this probability; news needs a
                            # lower bar than papers because the noise is the default

[signals]
paper_type = true
code_release = false        # the `usable` interest already covers this, better

# The contribution-type Choice, rewritten for news. The research defaults (new_method,
# benchmark, survey...) classify nothing here.
[signals.types]
announcement = "A first-party announcement of something that now exists or has changed"
measurement = "A report of measurements, results, or benchmarks someone ran"
release = "A release of code, weights, a dataset, or an API"
incident = "An outage, breach, recall, lawsuit, or other thing that went wrong"
business = "Funding, hiring, acquisitions, pricing, or other business events"
analysis = "An explanation or analysis of something that already happened"
rumour = "A claim attributed to unnamed sources, or a leak"
opinion = "An argument, prediction, or personal take"

[output]
site_dir = "site/public/signal"
data_dir = "data/public/signal"
site_url = "https://eliot5566.github.io/JEV-Paper-Radar/public/signal/"
feed_days = 14
near_misses = 10            # worth watching on a new radar: these are what the
                            # thresholds are about to let through or keep out
tagline = "Tech news with the retellings removed: first-party announcements, measured numbers, and things you can use today."
