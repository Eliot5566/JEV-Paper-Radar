# Signal Radar — tech news, filtered for first-hand information.
#
# The other radars in this folder answer "is this paper about my field?". News does not
# have that problem; it has the opposite one. Everything in a tech feed is about your
# field, fifteen times over. The question worth asking is "is this new information, or
# is it the fifteenth retelling of someone else's announcement?"
#
# So the three interests below are about PROVENANCE and EVIDENCE, not topic, and they
# are deliberately not about importance: a radar cannot know what matters to you, but it
# can tell a release note from a prediction. Interests combine with `max`, so any one of
# the three is enough to keep an item; the exclusions then veto the retellings.
#
# Duplicate folding is on (see [radar] below). On a news feed it is most of the value:
# one announcement reaches this radar from the lab's own blog, three outlets, Hacker
# News and two subreddits, and judging all seven costs seven times as much as judging
# one. Folding happens before Jev sees anything.
#
# Everything here is public and needs no key. There is no X / Twitter source: X has had no free read API since 2023 and its
# terms forbid reading a timeline through anything else. Bluesky is the substitute, and
# checked on 2026-10-02 its author feeds answer without a key, account or rate-limit
# deal — while `searchPosts` answers 403 unless you are logged in, so accounts are named
# here rather than keywords.

[radar]
title = "Signal Radar"
max_papers = 1500
combine = "max"
fold_duplicates = true
fold_threshold = 0.6        # token overlap on titles; 0.6 merges retitled copies and
                            # leaves "GPT-5 ships" and "GPT-6 ships" apart

[jev]
backend = "typesafe"
model = "jev-1.13.0"
concurrency = 8

# ── Reddit ──────────────────────────────────────────────────────────────────────
# Read through each subreddit's public RSS, because the API is closed to new projects:
# since 2025-11-11 reddit.com/prefs/apps no longer creates apps (new access is a Data
# Access Request, answered in weeks and not always yes), and since 2026-05-30 anonymous
# `.json` answers 403 to everyone. Measured here: the `reddit` source failed on all four
# bundles on every run of 2026-10-02.
#
# RSS gives titles and links but no scores, so the floors below are gone; `top` over
# `t=day` is still Reddit's own ranking, and `limit` takes the head of it instead. The
# `+` joins subreddits into one feed, ranked together — which is why r/technology stays
# in a bundle of its own, where its scores cannot drown out r/MachineLearning.
#
# Measured 2026-10-02 from GitHub Actions: anonymous RSS works, but is rate-limited per
# IP. Fetched back to back, the 1st and 3rd feed answered and the 2nd and 4th got 429.
# Hence `delay`: seconds to wait before each fetch after the first.

[[sources]]
type = "rss"
name = "reddit-ai"
url = "https://www.reddit.com/r/singularity+accelerate+LocalLLaMA+MachineLearning/top/.rss?t=day&limit=40"

[[sources]]
type = "rss"
name = "reddit-releases"
delay = 12
url = "https://www.reddit.com/r/OpenAI+ClaudeAI+StableDiffusion/top/.rss?t=day&limit=25"

[[sources]]
type = "rss"
name = "reddit-industry"
delay = 12
url = "https://www.reddit.com/r/artificial+startups+SaaS/top/.rss?t=day&limit=20"

[[sources]]
type = "rss"
name = "reddit-tech"
delay = 12
url = "https://www.reddit.com/r/technology+programming+hardware/top/.rss?t=day&limit=20"

# With Reddit-approved API credentials (REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET as repo
# secrets), the `reddit` source gets scores, comment counts and per-bundle floors. Swap
# a block above for one like this:
#
# [[sources]]
# type = "reddit"
# name = "reddit-ai"
# subreddits = ["singularity", "accelerate", "LocalLLaMA", "MachineLearning"]
# listing = "top"
# period = "day"
# min_score = 60
# min_comments = 5

# ── Bluesky ─────────────────────────────────────────────────────────────────────
# Every handle below was checked against app.bsky.actor.getProfiles on 2026-10-02 and
# is posting: a handle that merely exists is worse than no source at all, and several
# obvious guesses turned out to be squatted, empty or parody accounts. The labs
# themselves are NOT usefully here — anthropic.com has 16,000 followers and zero posts,
# deepmind.bsky.social and huggingface.bsky.social are empty, openai.com does not
# resolve — so first-party lab announcements come from their own RSS below, not from
# here. What Bluesky gives you is the people who read the papers.

[[sources]]
type = "bluesky"
name = "bluesky-people"
actors = [
  "simonwillison.net",            # 4,977 posts: releases, with what he actually tried
  "natolambert.bsky.social",      # Interconnects; post-training and open models
  "emollick.bsky.social",         # Wharton; evaluations of what the tools can do
  "hardmaru.bsky.social",         # low volume, high signal
]
limit = 50
filter = "posts_no_replies"
min_likes = 10

[[sources]]
type = "bluesky"
name = "bluesky-press"
actors = ["theverge.com", "arstechnica.com", "wired.com", "404media.co", "technologyreview.com"]
limit = 50
require_link = true         # the link card is the story; a bare post from an outlet is a tease
min_likes = 25              # these accounts post everything they publish

# ── Hacker News and aggregators ─────────────────────────────────────────────────

[[sources]]
type = "rss"
name = "hn"
url = "https://hnrss.org/newest?points=150"

[[sources]]
type = "rss"
name = "techmeme"
url = "https://www.techmeme.com/feed.xml"

# ── First-party: release feeds ──────────────────────────────────────────────────
# GitHub serves <repo>/releases.atom for every public repository, which makes these the
# most reliably first-hand source on this list: the text is written by the people who
# shipped the thing, and the version number is a verifiable number by construction.

[[sources]]
type = "rss"
name = "releases-vllm"
url = "https://github.com/vllm-project/vllm/releases.atom"

[[sources]]
type = "rss"
name = "releases-ollama"
url = "https://github.com/ollama/ollama/releases.atom"

[[sources]]
type = "rss"
name = "releases-llama-cpp"
url = "https://github.com/ggml-org/llama.cpp/releases.atom"

[[sources]]
type = "rss"
name = "releases-transformers"
url = "https://github.com/huggingface/transformers/releases.atom"

# ── First-party: blogs ──────────────────────────────────────────────────────────
# Verify these before trusting them. Lab sites restructure often and several do not
# serve a feed at all; a 404 here shows up on the page as "<name> did not answer"
# rather than as a quiet gap. `paper-radar run -c radars/signal.toml --dry-run` fetches
# every source and judges nothing, so it costs nothing to check.

[[sources]]
type = "rss"
name = "simonwillison"
url = "https://simonwillison.net/atom/everything/"

[[sources]]
type = "rss"
name = "interconnects"
url = "https://www.interconnects.ai/feed"

[[sources]]
type = "rss"
name = "huggingface-blog"
url = "https://huggingface.co/blog/feed.xml"

# Unverified as of 2026-10-02 — uncomment one at a time once --dry-run shows it works:
