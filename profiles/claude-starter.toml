# Small first-run profile. The 20-paper cap is not a dollar spending limit.
[radar]
title = "My Claude Paper Radar"
max_papers = 20

[jev]
backend = "claude"
model = "claude-haiku-5-5"
concurrency = 2
requests_per_minute = 30
# Editable USD/MTok estimates; verify your model and prompt-length tier.
# Source and accounting limits: ../docs/usage-and-cost.md
price_per_mtok = 0.10
output_price_per_mtok = 0.50
# The questions are sent as a cached prefix: reads are 0.1x input and
# 5-minute cache writes 1.25x input on Haiku 5.5.
cache_read_price_per_mtok = 0.01
cache_creation_price_per_mtok = 0.125
pricing_as_of = "2026-11-13"
# effort = "low"   # the default for Claude; "" sends none (models without effort)
# batch = true     # half price via the Message Batches API; results usually in minutes

[[sources]]
type = "arxiv"
categories = ["cs.AI", "cs.CL"]

[[interests]]
id = "agent_eval"
label = "Agent evaluation"
text = "Benchmarks for evaluating LLM agents on multi-step tool-use tasks"

[thresholds]
# Display bands only: these are not validated precision or recall targets.
must_read = 0.80
maybe = 0.50
exclude = 0.80

[output]
site_dir = "site"
data_dir = "data"
